<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل القطعة | متحفي (Mat7afi)</title>
    <meta name="description" content="تعرف على تاريخ وقصة هذه القطعة من متاحف جامعة المنيا. شرح صوتي ومعلومات موثقة.">
    <meta name="keywords" content="تفاصيل الأثر, شرح صوتي, متاحف المنيا, متحفي, استكشاف رقمي, جامعة المنيا">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#F8F9FA">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://appwrite.etihadalmdina.com https://upload.wikimedia.org; connect-src 'self' https://appwrite.etihadalmdina.com https://api.openai.com; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="متحفي - Mat7afi">
    <meta property="og:title" content="تفاصيل القطعة | متحفي">
    <meta property="og:description" content="تعرف على تاريخ وقصة هذه القطعة من متاحف جامعة المنيا.">
    <meta property="og:image" content="https://mat7afi.site/assets/Cover.png">

    <link rel="icon" type="image/png" href="assets/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="artifact-page-body">

    <a href="javascript:history.back()" class="btn-back">
        <i class="fas fa-arrow-right"></i>
    </a>

    <a href="index.html" class="btn-home">
        <i class="fas fa-home"></i>
    </a>

    <div id="loader" class="text-center py-5">
        <div class="spinner-border text-accent" role="status"></div>
        <p class="mt-3">جاري تحميل التفاصيل...</p>
    </div>

    <div id="artifact-content" style="display: none;">
        <div class="artifact-header">
            <img id="artifact-img" src="" alt="" class="artifact-header-img" onerror="this.style.display='none'">
            <div class="artifact-header-overlay"></div>
        </div>

        <main class="container artifact-content-wrap">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Basic Info -->
                    <h3 class="section-title-mobile">تفاصيل القطعة</h3>
                    <div id="info-card" class="mobile-info-card">
                        <!-- Rows will be injected here -->
                    </div>

                    <!-- Description -->
                    <h3 class="section-title-mobile">الوصف</h3>
                    <div class="description-card mb-4">
                        <p id="artifact-desc"></p>
                    </div>

                    <!-- Audio (Optional) -->
                    <div id="audio-section" style="display: none;">
                        <h3 class="section-title-mobile">استمع للشرح الصوتي</h3>
                        <div class="audio-card">
                            <div class="mobile-icon-circle">
                                <i class="fas fa-headphones"></i>
                            </div>
                            <audio id="artifact-audio" controls class="w-100"></audio>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const collection = urlParams.get('collection');
            const museum = urlParams.get('museum');

            if (id && collection) {
                initArtifactPage(id, collection, museum);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

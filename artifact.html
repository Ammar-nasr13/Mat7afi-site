<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل القطعة | Mat7afi Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="artifact.css">
</head>
<body>

    <header class="artifact-hero">
        <div class="back-nav">
            <a href="javascript:history.back()" class="btn-premium-back">
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
        
        <img id="artifact-img" src="assets/placeholder.png" alt="Artifact" class="artifact-main-img" onerror="this.src='assets/placeholder.png'">
        
        <!-- 360 Button center bottom -->
        <div class="btn-360-wrap">
            <button class="btn-360" onclick="alert('خاصية العرض ثلاثي الأبعاد ستكون متاحة قريباً في نسخة الويب ✨')">
                <i class="fas fa-sync-alt"></i>
                <span>عـرض 360°</span>
            </button>
        </div>

        <!-- Hero Info Bottom Right -->
        <div class="hero-title-info">
            <h1 id="artifact-name-hero">جاري التحميل...</h1>
            <p id="artifact-subtitle-hero"></p>
        </div>
    </header>

    <div class="details-container">
        <main class="main-card">
            <div id="loader" class="text-center py-5">
                <div class="spinner-border text-gold" style="width: 3rem; height: 3rem; color: #3B2403;"></div>
                <p class="mt-3 fw-bold" style="color: #3B2403;">جاري استحضار التاريخ...</p>
            </div>

            <div id="artifact-content" style="display: none;">
                <!-- Audio Guide - Moved up like mobile might prefer or keep structure -->
                <div id="audio-section" class="mb-5" style="display: none;">
                    <div class="mobile-audio-box">
                        <div class="audio-controls">
                            <button id="play-pause-btn" class="audio-play-btn">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="wave-player">
                                <div id="waveform" class="wave-bars">
                                    <!-- Bars injected -->
                                </div>
                                <div class="audio-timers">
                                    <span id="current-time">00:00</span>
                                    <span class="mx-1">/</span>
                                    <span id="duration-time">00:00</span>
                                </div>
                            </div>
                        </div>
                        <audio id="artifact-audio" style="display: none;"></audio>
                    </div>
                </div>

                <!-- Info Grid -->
                <h3 class="section-title">بطاقة التعريف</h3>
                <div class="info-grid" id="info-grid">
                    <!-- Items will be injected -->
                </div>

                <!-- Description -->
                <h3 class="section-title">عن هذه القطعة</h3>
                <div class="description-text" id="artifact-desc">
                    تحميل القصة التاريخية...
                </div>
            </div>
        </main>
    </div>

    <!-- SDK & Script -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const collection = urlParams.get('collection');
            const museum = urlParams.get('museum');

            if (id && collection) {
                initArtifactPage(id, collection, museum);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القطعة الأثرية | متحفي - متاحف جامعة المنيا</title>
    <meta name="description" content="استكشف تفاصيل القطع الأثرية في متاحف جامعة المنيا.">
    <meta name="keywords" content="قطعة أثرية, متاحف المنيا, آثار مصرية, متاحف جامعة المنيا, Mat7afi Artifact">
    <meta name="author" content="Ammar Nasr - Ego Pro">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#172554">
    <link rel="canonical" href="https://mat7afi.site/artifact.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="متحفي - Mat7afi">
    <meta property="og:title" content="القطعة الأثرية | متحفي">
    <meta property="og:description" content="استكشف تفاصيل القطع الأثرية في متاحف جامعة المنيا بجودة عالية وشرح مفصل.">
    <meta property="og:image" content="https://mat7afi.site/assets/Cover.png">
    <meta property="og:url" content="https://mat7afi.site/artifact.html">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="القطعة الأثرية | متحفي">
    <meta property="twitter:description" content="استكشف تفاصيل القطع الأثرية في متاحف جامعة المنيا.">
    <meta property="twitter:image" content="https://mat7afi.site/assets/Cover.png">
    <meta property="twitter:url" content="https://mat7afi.site/artifact.html">

    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="shortcut icon" href="assets/icon.png" type="image/x-icon">
    
    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://appwrite.etihadalmdina.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <link rel="stylesheet" href="css/artifact.css">
</head>
<body>

    <header class="artifact-hero">
        <div class="back-nav">
            <a href="javascript:history.back()" class="btn-premium-back">
                <i class="fas fa-arrow-right"></i>
            </a>
        </div>
        
        <img id="artifact-img" src="" alt="Artifact" class="artifact-main-img" fetchpriority="high">
        
        <!-- 360 Button center bottom -->
        <div class="btn-360-wrap" id="btn-360-wrap" style="display: none;">
            <button class="btn-360" id="btn-360-element">
                <i class="fas fa-cube"></i>
                <span data-i18n="artifact_360">عـرض 360°</span>
            </button>
        </div>

        <!-- Hero Info Bottom Right -->
        <div class="hero-title-info">
            <h1 id="artifact-name-hero">جاري التحميل...</h1>
            <p id="artifact-subtitle-hero"></p>
        </div>
    </header>

    <div class="details-container">
        <main class="main-card">
            <div id="loader" class="text-center py-5">
                <div class="spinner-border text-gold" style="width: 3rem; height: 3rem; color: #3B2403;"></div>
                <p class="mt-3 fw-bold" style="color: #3B2403;">جاري استحضار التاريخ...</p>
            </div>

            <div id="artifact-content" style="display: none;">
                <!-- Info Grid -->
                <h3 class="section-title">بطاقة التعريف</h3>
                <div class="info-grid" id="info-grid">
                    <!-- Items will be injected -->
                </div>

                <!-- Description -->
                <h3 class="section-title">الوصف</h3>
                <div class="description-text" id="artifact-desc">
                    تحميل القصة التاريخية...
                </div>

                <!-- Geology-only sections (matches mobile app) -->
                <div id="geology-extra-sections"></div>

                <!-- Audio Guide - Moved to bottom -->
                <div id="audio-section" class="mt-5 mb-5" style="display: none;">
                    <h3 style="color: var(--brown); font-weight: 800; font-size: 1.3rem; margin-bottom: 20px; text-align: start;">استمع الي الوصف الصوتي</h3>
                    <div class="mobile-audio-box">
                        <div class="audio-controls">
                            <button id="play-pause-btn" class="audio-play-btn">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="waveform-slider-container" id="waveform-slider-container">
                                <div class="waveform-slider" id="waveform-slider">
                                    <div class="waveform-bars" id="waveform-bars"></div>
                                    <div class="seeker-head" id="seeker-head" style="left: 0%;">
                                        <div class="seeker-line"></div>
                                        <div class="seeker-knob"></div>
                                        <div class="seeker-time" id="seeker-time">00:00 / 00:00</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <audio id="artifact-audio" preload="auto" style="display: none;"></audio>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SDK & Script -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="js/script.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const collection = urlParams.get('collection');
            const museum = urlParams.get('museum');

            if (id && collection) {
                initArtifactPage(id, collection, museum);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

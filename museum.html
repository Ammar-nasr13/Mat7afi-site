<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استكشاف المتاحف | متحفي (Mat7afi)</title>
    <meta name="description" content="تصفح مقتنيات متاحف جامعة المنيا. اكتشف القطع الأثرية النادرة، اللوحات الفنية، والعينات العلمية بدقة عالية.">
    <meta name="keywords" content="قطع أثرية, متاحف المنيا, متحفي, متاحف مصر, استكشاف رقمي, جامعة المنيا">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mat7afi.site/museum.html">
    <meta property="og:url" content="https://mat7afi.site/museum.html">
    <meta name="theme-color" content="#422006">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://appwrite.etihadalmdina.com https://upload.wikimedia.org; connect-src 'self' https://appwrite.etihadalmdina.com https://api.openai.com https://generativelanguage.googleapis.com; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="متحفي - Mat7afi">
    <meta property="og:title" content="استكشاف المتاحف | متحفي">
    <meta property="og:description" content="استكشف مقتنيات متاحف جامعة المنيا بجودة عالية وشرح مفصل.">
    <meta property="og:image" content="https://mat7afi.site/assets/Cover.png">
    
    <link rel="icon" type="image/png" href="assets/icon.png">
    
    <link rel="preconnect" href="https://appwrite.etihadalmdina.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="museum-page">

    <!-- Mobile-style Hero Header (matches Flutter MuseumDetailsHeader) -->
    <header class="museum-hero-premium">
        <img id="museum-hero-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="museum-hero-img" alt="Museum Hero">
        <div class="museum-hero-overlay"></div>
        
        <a href="index.html" class="museum-back-btn" title="عودة">
            <i class="fas fa-arrow-right"></i>
        </a>

        <div class="museum-hero-content">
            <h1 id="museum-title-hero" class="museum-title-main">جاري التحميل...</h1>
            <div class="museum-meta">
                <span class="location">المنيا <i class="fas fa-map-marker-alt ms-1"></i></span>
                <div class="stars text-warning">
                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Search Bar (mobile style) -->
    <section class="search-section-museum">
        <div class="container px-3">
            <div class="museum-search-box-light">
                <input type="text" id="artifact-search" placeholder="ابحث داخل مقتنيات هذا المتحف..." data-i18n-placeholder="museum_search_placeholder">
                <div class="search-icon-btn">
                    <i class="fas fa-search"></i>
                </div>
            </div>
        </div>
    </section>

    <!-- Back to halls / sub-museums navigation -->
    <div class="container px-3">
        <div id="back-to-halls-btn" style="display: none;"></div>
    </div>

    <main class="container py-4 px-3">
        <div id="artifacts-grid" class="row g-3">
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js?v=7"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const collectionId = urlParams.get('id');
            const museumName = urlParams.get('name');
            const museumImg = urlParams.get('img');

            if (collectionId && museumName) {
                const titleHero = document.getElementById('museum-title-hero');
                if (titleHero) titleHero.innerText = museumName;

                const heroImg = document.getElementById('museum-hero-img');
                if (heroImg && museumImg) heroImg.src = museumImg;
                
                if (typeof initMuseumPage === 'function') {
                    initMuseumPage(collectionId, museumName, museumImg);
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استكشاف المتاحف | متحفي (Mat7afi)</title>
    <meta name="description" content="تصفح مقتنيات متاحف جامعة المنيا. اكتشف القطع الأثرية النادرة، اللوحات الفنية، والعينات العلمية بدقة عالية.">
    <meta name="keywords" content="قطع أثرية, متاحف المنيا, متحفي, متاحف مصر, استكشاف رقمي, جامعة المنيا">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mat7afi.site/museum.html">
    <meta property="og:url" content="https://mat7afi.site/museum.html">
    <meta property="twitter:url" content="https://mat7afi.site/museum.html">
    <meta name="theme-color" content="#172554">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://appwrite.etihadalmdina.com https://upload.wikimedia.org; connect-src 'self' https://appwrite.etihadalmdina.com https://api.openai.com; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="متحفي - Mat7afi">
    <meta property="og:title" content="استكشاف المتاحف | متحفي">
    <meta property="og:description" content="استكشف مقتنيات متاحف جامعة المنيا بجودة عالية وشرح مفصل.">
    <meta property="og:image" content="https://mat7afi.site/assets/Cover.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="استكشاف المتاحف | متحفي">
    <meta property="twitter:description" content="استكشف مقتنيات متاحف جامعة المنيا بجودة عالية.">
    <meta property="twitter:image" content="https://mat7afi.site/assets/Cover.png">
    
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-navy">

    <!-- Museum Premium Header from Global CSS -->
    <header class="museum-hero-premium">
        <img id="museum-hero-img" src="assets/Cover.png" class="museum-hero-img" alt="Museum Hero">
        <div class="museum-hero-overlay"></div>
        
        <div class="museum-header-nav">
            <a href="index.html" class="btn-back-circle"><i class="fas fa-arrow-right"></i></a>
        </div>

        <div class="museum-hero-content">
            <h1 id="museum-title-hero" class="museum-title-main">جاري التحميل...</h1>
            <div class="museum-meta">
                <span class="location"><i class="fas fa-location-dot me-2"></i> جامعة المنيا، مصر</span>
                <div class="stars ms-3">
                    <i class="fas fa-star text-warning"></i>
                    <i class="fas fa-star text-warning"></i>
                    <i class="fas fa-star text-warning"></i>
                    <i class="fas fa-star text-warning"></i>
                    <i class="fas fa-star text-warning"></i>
                </div>
            </div>
        </div>
    </header>


    <!-- Content -->
    <section class="search-section-museum">
        <div class="container">
            <div class="museum-search-box">
                <input type="text" id="artifact-search" placeholder="ابحث في مقتنيات المتحف..." class="text-white border-0">
                <i class="fas fa-search text-accent"></i>
            </div>
        </div>
    </section>

    <main class="container py-5">
        <div id="artifacts-grid" class="row g-4">
            <!-- Skeletons initially -->
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
        </div>

        <!-- Museum Audio Guide Section -->
        <div id="museum-audio-guide" style="display: none;" class="mt-5 text-center" data-aos="fade-up">
            <h3 style="color: var(--brown); font-weight: 800; font-size: 1.8rem; margin-bottom: 20px;">استمع إلى الوصف الصوتي</h3>
            <div class="mobile-audio-box" style="max-width: 600px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);">
                <audio controls style="width: 100%; border-radius: 30px; outline: none;">
                    <source src="#" id="museum-audio-src" type="audio/mpeg">
                    متصفحك لا يدعم مشغل الصوت.
                </audio>
            </div>
        </div>
    </main>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const collectionId = urlParams.get('id');
            const museumName = urlParams.get('name');
            const museumImg = urlParams.get('img');

            if (collectionId && museumName) {
                // Correct ID is museum-title-hero
                const titleHero = document.getElementById('museum-title-hero');
                if (titleHero) titleHero.innerText = museumName;

                // Sync image immediately from URL
                const heroImg = document.getElementById('museum-hero-img');
                if (heroImg && museumImg) heroImg.src = museumImg;
                
                // Call global init function
                if (typeof initMuseumPage === 'function') {
                    initMuseumPage(collectionId, museumName, museumImg);
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

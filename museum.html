<body class="museum-page" style="background-color: #ffffff; color: #333;">

    <!-- Museum Premium Header from Global CSS -->
    <header class="museum-hero-premium position-relative" style="height: 35vh; min-height: 250px; overflow: hidden; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;">
        <img id="museum-hero-img" src="assets/Cover.png" class="museum-hero-img w-100 h-100 object-fit-cover position-absolute top-0 start-0" alt="Museum Hero">
        <div class="museum-hero-overlay position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);"></div>
        
        <div class="museum-hero-content-wrapper d-flex justify-content-between align-items-end w-100 px-4 pb-4 position-absolute bottom-0 z-3">
            <div class="museum-info text-start">
                <h1 id="museum-title-hero" class="museum-title-main fw-bold text-white mb-1" style="font-size: 1.4rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">جاري التحميل...</h1>
                <div class="museum-meta d-flex align-items-center justify-content-start gap-3 text-white">
                    <span class="location fw-semibold text-white" style="text-shadow: 0 1px 3px rgba(0,0,0,0.5);">المنيا <i class="fas fa-map-marker-alt ms-1"></i></span>
                    <div class="stars text-warning" style="font-size: 0.9rem;">
                        <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                    </div>
                </div>
            </div>
            <div class="museum-action d-flex align-items-center">
                <a href="index.html" class="btn-share-circle d-flex align-items-center justify-content-center text-white text-decoration-none" style="width: 50px; height: 50px; background: rgba(74, 44, 17, 0.9); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 1.2rem;">
                    <i class="fas fa-share"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Content -->
    <section class="search-section-museum py-3 mt-3">
        <div class="container px-3">
            <div class="museum-search-box-light shadow-sm" style="background: white; border: 1px solid #e0e0e0; border-radius: 50px; padding: 5px; display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto;">
                <input type="text" id="artifact-search" placeholder="ابحث داخل مقتنيات هذا المتحف..." data-i18n-placeholder="museum_search_placeholder" class="border-0 bg-transparent px-3 w-100" style="color: #666; outline: none; font-size: 0.95rem; text-align: start;">
                <div style="background: #4a2c11; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;">
                    <i class="fas fa-search text-white" style="font-size: 0.9rem;"></i>
                </div>
            </div>
        </div>
    </section>

    <main class="container py-5">
        <div id="artifacts-grid" class="row g-3">
            <!-- Skeletons initially -->
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-6">
                <div class="skeleton skeleton-card"></div>
        </div>
            </div>
        </div>
    </main>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const collectionId = urlParams.get('id');
            const museumName = urlParams.get('name');
            const museumImg = urlParams.get('img');

            if (collectionId && museumName) {
                // Correct ID is museum-title-hero
                const titleHero = document.getElementById('museum-title-hero');
                if (titleHero) titleHero.innerText = museumName;

                // Sync image immediately from URL
                const heroImg = document.getElementById('museum-hero-img');
                if (heroImg && museumImg) heroImg.src = museumImg;
                
                // Call global init function
                if (typeof initMuseumPage === 'function') {
                    initMuseumPage(collectionId, museumName, museumImg);
                }
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>

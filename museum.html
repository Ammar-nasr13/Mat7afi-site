<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استكشاف المتاحف | متحفي (Mat7afi)</title>
    <meta name="description" content="تصفح مقتنيات متاحف جامعة المنيا. اكتشف القطع الأثرية النادرة، اللوحات الفنية، والعينات العلمية بدقة عالية.">
    <meta name="keywords" content="قطع أثرية, متاحف المنيا, متحفي, متاحف مصر, استكشاف رقمي, جامعة المنيا">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mat7afi.site/museum.html">
    <meta property="og:url" content="https://mat7afi.site/museum.html">
    <meta property="twitter:url" content="https://mat7afi.site/museum.html">
    <meta name="theme-color" content="#172554">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://appwrite.etihadalmdina.com https://upload.wikimedia.org; connect-src 'self' https://appwrite.etihadalmdina.com https://api.openai.com; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="متحفي - Mat7afi">
    <meta property="og:title" content="استكشاف المتاحف | متحفي">
    <meta property="og:description" content="استكشف مقتنيات متاحف جامعة المنيا بجودة عالية وشرح مفصل.">
    <meta property="og:image" content="https://mat7afi.site/assets/Cover.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="استكشاف المتاحف | متحفي">
    <meta property="twitter:description" content="استكشف مقتنيات متاحف جامعة المنيا بجودة عالية.">
    <meta property="twitter:image" content="https://mat7afi.site/assets/Cover.png">
    
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-navy">

    <!-- Header -->
    <header class="py-3 bg-navy sticky-top shadow-sm border-bottom border-white border-opacity-10">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <a href="index.html" class="btn-back-header me-3"><i class="fas fa-arrow-right"></i></a>
                <h2 id="museum-title" class="overlay-title text-white">تحميل...</h2>
            </div>
            <a href="index.html">
                <img src="assets/logo.png" alt="شعار متاحف جامعة المنيا - Mat7afi" class="nav-logo" style="background: white; padding: 5px; border-radius: 8px;">
            </a>
        </div>
    </header>

    <style>
        .btn-back-header {
            color: white !important;
            text-decoration: none !important;
            font-size: 1.2rem;
            transition: var(--transition);
        }
        .btn-back-header:hover {
            transform: scale(1.1);
        }
        .bg-navy {
            background-color: var(--navy) !important;
        }
        .overlay-title {
            font-weight: 800;
            margin: 0;
            font-size: 1.25rem;
        }
    </style>



    <!-- Search Section -->
    <section class="py-4 bg-navy-dark border-bottom border-white border-opacity-10">
        <div class="container">
            <div class="search-container">
                <input type="text" id="artifact-search" class="search-input" placeholder="ابحث عن قطعة أثرية باسمها...">
                <i class="fas fa-search search-icon"></i>
            </div>
        </div>
    </section>

    <!-- Content -->
    <main class="container py-5" style="min-height: 80vh;">
        <div id="artifacts-grid" class="row g-4">
            <!-- Skeletons initially -->
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="skeleton skeleton-card"></div>
            </div>
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </main>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const collectionId = urlParams.get('id');
            const museumName = urlParams.get('name');

            if (collectionId && museumName) {
                document.getElementById('museum-title').innerText = museumName;
                initMuseumPage(collectionId, museumName);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
